==========================================
ASSIGNMENT 10
Cloud-Based Student Record Management System
==========================================


PROBLEM STATEMENT:
Deploy a web application that stores and manages student records using a database and backend API.
Deploy the frontend interface and ensure users can perform operations such as adding, updating, and
retrieving student data.

(Note: Dummy application/GitHub repository allowed)


==========================================
WHAT WE ARE IMPLEMENTING
==========================================

Frontend:
- Student Record Form
- Student Cards

Backend:
- Node.js + Express Server

Cloud:
- AWS EC2 Deployment

Database:
- Dummy/In-Memory Data (No real DB required for LP2)


==========================================
PROJECT FLOW
==========================================

Frontend UI
↓
Node.js + Express
↓
AWS EC2 Deployment


==========================================
FILES REQUIRED
==========================================

Assignment10/
│
├── index.html
├── style.css
├── server.js
└── package.json


==========================================
STEP 0
Launch EC2 Instance
==========================================

AWS Console → EC2 → Launch Instance

Name:
LP2-Assignment10

AMI:
Ubuntu Server

Instance Type:
t2.micro

Create Key Pair:
lp2.pem

Allow:
Port 22 → SSH
Port 80 → HTTP

Launch Instance


==========================================
STEP 1
Copy Public IP
==========================================

Example:
98.82.187.249


==========================================
STEP 2
Create GitHub Repository Files
==========================================

Create:
Assignment10/index.html
Assignment10/style.css
Assignment10/server.js
Assignment10/package.json


==========================================
STEP 3
Open Terminal
==========================================

cd ~/Downloads


==========================================
STEP 4
Check PEM File
==========================================

ls


==========================================
STEP 5
Give Permission To PEM File
==========================================

chmod 400 lp2.pem


==========================================
STEP 6
Connect To EC2 Using SSH
==========================================

ssh -i lp2.pem ubuntu@98.82.187.249


==========================================
STEP 7
Update Ubuntu Packages
==========================================

sudo apt update


==========================================
STEP 8
Install Git
==========================================

sudo apt install git -y


==========================================
STEP 9
Install Node.js and npm
==========================================

sudo apt install nodejs npm -y


==========================================
STEP 10
Check Node.js Version
==========================================

node -v


==========================================
STEP 11
Clone GitHub Repository
==========================================

git clone https://github.com/joshitanisha/LP2.git


==========================================
STEP 12
Open Assignment10 Folder
==========================================

cd LP2/Assignment10


==========================================
STEP 13
Install Dependencies
==========================================

npm install


==========================================
STEP 14
Run Node.js Server
==========================================

node server.js

Output:
Server running on port 3000


==========================================
STEP 15
Configure Security Group
==========================================

AWS Console → EC2 → Security Groups

Inbound Rules → Edit Inbound Rules

Add:
Type: Custom TCP
Port: 3000
Source: Anywhere

Save Rules


==========================================
STEP 16
Open Website In Browser
==========================================

http://98.82.187.249:3000


==========================================
FUNCTIONALITIES
==========================================

- Add Student
- Display Student Records
- Retrieve Student Details
- Dummy CRUD Operations


==========================================
IMPORTANT VIVA QUESTIONS
==========================================

What is CRUD?
Create Read Update Delete

What is Node.js?
JavaScript runtime environment

What is Express.js?
Backend framework for Node.js

What is Deployment?
Making application accessible online

Why Port 3000?
Used for Node.js applications

What is EC2?
Virtual cloud server

What is Security Group?
Firewall controlling traffic


==========================================
AFTER COMPLETION
==========================================

AWS Console → EC2 → Instances

Instance State → Stop Instance

Do NOT terminate instance
